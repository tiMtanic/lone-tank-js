<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- import styles -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- import JS files -->
    <script src="./js/helpers.js" defer></script>
    <script src="./js/gameEntity.js" defer></script>
    <script src="./js/player.js" defer></script>
    <script src="./js/playerController.js" defer></script>
    <script src="./js/enemy.js" defer></script>
    <script src="./js/projectile.js" defer></script>
    <script src="./js/game.js" defer></script>

    <title>LONE TANK</title>
  </head>
  <body>
    <!-- start screen -->
    <div id="game-start-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="start-game-btn">START</button>
      </div>
    </div>

    <!-- gameplay screen -->
    <div id="gameplay-screen" class="game-screen-container">
      <div id="top-ui">
        <h1>LONE TANK</h1>
        <h1>LEVEL <span id="current-level">1</span></h1>
      </div>
      <div id="gameplay-container" class="main-content-container"></div>
      <div id="bottom-ui">
        <div id="health-bar-container">
          <div id="health-bar"></div>
          <div id="health-text-container">
            <span id="current-health">100</span>&nbsp;/&nbsp;<span id="max-health">100</span>
          </div>
        </div>
      </div>
    </div>

    <!-- game over screen -->
    <div id="game-over-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="restart-game-btn">RESTART</button>
      </div>
    </div>

    <!-- game win screen -->
    <div id="game-win-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="restart-game-btn">RESTART</button>
      </div>
    </div>
  </body>
</html>
