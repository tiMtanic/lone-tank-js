<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- import styles -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- import JS files -->
    <script src="./js/player.js" defer></script>
    <script src="./js/game.js" defer></script>

    <title>LONE TANK</title>
  </head>
  <body>
    <!-- start screen -->
    <div id="game-start-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="start-game-btn">START</button>
      </div>
    </div>

    <!-- gameplay screen -->
    <div id="gameplay-screen" class="game-screen-container">
      <div id="gameplay-container" class="main-content-container"></div>
    </div>

    <!-- game over screen -->
    <div id="game-over-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="restart-game-btn">RESTART</button>
      </div>
    </div>

    <!-- game win screen -->
    <div id="game-win-screen" class="game-screen-container">
      <div class="main-content-container menu-container">
        <h1>LONE TANK</h1>
        <button id="restart-game-btn">RESTART</button>
      </div>
    </div>
  </body>
</html>
